<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Data Form</title>
<style>
  :root{
    --ink:#1c2b3a;
    --ink-soft:#4a5b6c;
    --line:#d7dde3;
    --field-bg:#f6f8fa;
    --accent:#0b5fa5;
    --accent-dark:#08477d;
    --ok-bg:#e8f4ea;
    --ok-ink:#1f6b3a;
    --err:#b3261e;
    --paper:#ffffff;
    --canvas:#eef2f5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", Tahoma, Arial, sans-serif;
    background:var(--canvas);
    color:var(--ink);
    padding:32px 16px 64px;
  }
  .sheet{
    max-width:720px;
    margin:0 auto;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .letterhead{
    background:var(--accent-dark);
    color:#fff;
    padding:22px 28px;
    border-bottom:4px solid var(--accent);
  }
  .letterhead .dept{
    font-size:13px;
    letter-spacing:.02em;
    opacity:.85;
    margin:0 0 4px;
  }
  .letterhead h1{
    font-size:21px;
    margin:0 0 6px;
    font-weight:600;
  }
  .letterhead p{
    margin:0;
    font-size:13px;
    opacity:.9;
    line-height:1.5;
  }
  form{
    padding:28px;
  }
  .field{
    margin-bottom:18px;
  }
  .field label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }
  .field .hint{
    font-weight:400;
    color:var(--ink-soft);
    font-size:12px;
  }
  .field input,
  .field select,
  .field textarea{
    width:100%;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:var(--field-bg);
    border:1px solid var(--line);
    border-radius:4px;
    outline:none;
    transition:border-color .15s, background .15s;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus{
    border-color:var(--accent);
    background:#fff;
  }
  .field select:disabled,
  .field input:disabled{
    background:#eceff2;
    color:#98a3ad;
    cursor:not-allowed;
  }
  .field textarea{
    resize:vertical;
    min-height:64px;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:520px){
    .row2{grid-template-columns:1fr;}
  }
  .required-mark{
    color:var(--err);
    margin-left:2px;
  }
  .submit-row{
    margin-top:26px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  button[type="submit"]{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px 26px;
    font-size:14.5px;
    font-weight:600;
    border-radius:4px;
    cursor:pointer;
    transition:background .15s;
  }
  button[type="submit"]:hover{
    background:var(--accent-dark);
  }
  button[type="submit"]:disabled{
    background:#9fb6c7;
    cursor:not-allowed;
  }
  .status{
    font-size:13.5px;
  }
  .status.ok{color:var(--ok-ink);}
  .status.err{color:var(--err);}
  .banner{
    display:none;
    margin:0 28px 0;
    padding:14px 16px;
    border-radius:4px;
    font-size:14px;
  }
  .banner.show{display:block;}
  .banner.ok{
    background:var(--ok-bg);
    color:var(--ok-ink);
    border:1px solid #bfe0c6;
  }
  .banner.err{
    background:#fbeceb;
    color:var(--err);
    border:1px solid #f0c4c1;
  }
  .foot-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:18px;
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="letterhead">
    <p class="dept">Municipal Corporation</p>
    <h1>Employee Data Collection Form</h1>
    <p>Please fill in the details accurately. Fields marked <span class="required-mark">*</span> are mandatory.</p>
  </div>

  <div id="banner" class="banner"></div>

  <form id="employeeForm">

    <div class="field">
      <label for="fullName">Full Name <span class="required-mark">*</span></label>
      <input type="text" id="fullName" name="Full Name" required autocomplete="off">
    </div>

    <div class="row2">
      <div class="field">
        <label for="branch">Branch <span class="required-mark">*</span></label>
        <select id="branch" name="Branch" required>
          <option value="" disabled selected>Select branch</option>
        </select>
      </div>

      <div class="field">
        <label for="subBranch">Sub-Branch <span class="hint">(if applicable)</span></label>
        <select id="subBranch" name="Sub-Branch" disabled>
          <option value="" selected>Not applicable</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="designation">Designation <span class="required-mark">*</span></label>
      <input type="text" id="designation" name="Designation" required autocomplete="off">
    </div>

    <div class="row2">
      <div class="field">
        <label for="wardNo">Ward No. <span class="hint">(if applicable)</span></label>
        <input type="text" id="wardNo" name="Ward No" autocomplete="off">
      </div>
      <div class="field">
        <label for="zoneNo">Zone No. <span class="hint">(if applicable)</span></label>
        <input type="text" id="zoneNo" name="Zone No" autocomplete="off">
      </div>
    </div>

    <div class="field">
      <label for="empNo">Employee No. / HKRN Code <span class="required-mark">*</span></label>
      <input type="text" id="empNo" name="Employee No / HKRN Code" required autocomplete="off">
    </div>

    <div class="row2">
      <div class="field">
        <label for="area">Area <span class="required-mark">*</span></label>
        <select id="area" name="Area" required>
          <option value="" disabled selected>Select area</option>
        </select>
      </div>

      <div class="field">
        <label for="roomNo">Room No. <span class="required-mark">*</span></label>
        <select id="roomNo" name="Room No" required disabled>
          <option value="" disabled selected>Select area first</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="phNo">Ph. No. <span class="required-mark">*</span></label>
        <input type="tel" id="phNo" name="Ph No" required autocomplete="off" pattern="[0-9+ -]{7,15}">
      </div>
      <div class="field">
        <label for="email">Email <span class="required-mark">*</span></label>
        <input type="email" id="email" name="Email" required autocomplete="off">
      </div>
    </div>

    <div class="field">
      <label for="remarks">Remarks <span class="hint">(if any)</span></label>
      <textarea id="remarks" name="Remarks"></textarea>
    </div>

    <div class="submit-row">
      <button type="submit" id="submitBtn">Submit</button>
      <span id="statusMsg" class="status"></span>
    </div>
  </form>

  <p class="foot-note">Your response is recorded directly against your name and branch. Please review before submitting.</p>
</div>

<script>
/* ====== CONFIGURATION ====== */

// Paste your deployed Google Apps Script Web App URL here
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-52cDGEAZqxBEKl2Lea4jjUh7nR1KTFnSJPAswUu_QPSKwxBVz6oWVQrsoTbeV8c1/exec";

/* ====== DATA: BRANCH -> SUB-BRANCH ====== */
// A branch with an empty array has no sub-branches (dropdown stays disabled / "Not applicable").
const branchData = {
  "Mayor": [],
  "Commissionar (CMC)": [],
  "Additional Commissioner": ["ACMC-I", "ACMC-II"],
  "Joint Commissioner": [],
  "Engineering Branch": ["Div-I", "Div-II", "Div-III"],
  "Corporation Secretary (CS)": [],
  "Establishment Branch (EO)": [],
  "Planning Branch": [],
  "District Attorny (DA)": [],
  "MOH Branch": [],
  "Audit Branch": [],
  "Accounts Branch": [],
  "Taxation": [],
  "HRMS Cell": [],
  "I.T Cell": [],
  "CPO Staff": [],
  "CFC": [],
  "AMRUT": [],
  "Tehsildar Branch": [],
  "AMRUT 2.0": [],
  "CM Window": [],
  "RTI Cell": []
};

/* ====== DATA: AREA -> ROOM NO. ====== */
function roomsForArea(){
  return ["001", "002", "003", "004", "005"];
}
const areaData = {
  "NIT": roomsForArea(),
  "OLD": roomsForArea(),
  "BLB": roomsForArea()
};

/* ====== BUILD BRANCH DROPDOWN ====== */
const branchSelect = document.getElementById("branch");
Object.keys(branchData).forEach(function(branch){
  const opt = document.createElement("option");
  opt.value = branch;
  opt.textContent = branch;
  branchSelect.appendChild(opt);
});

const subBranchSelect = document.getElementById("subBranch");
branchSelect.addEventListener("change", function(){
  const subs = branchData[this.value] || [];
  subBranchSelect.innerHTML = "";

  if (subs.length === 0){
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "Not applicable";
    opt.selected = true;
    subBranchSelect.appendChild(opt);
    subBranchSelect.disabled = true;
    subBranchSelect.removeAttribute("required");
  } else {
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select sub-branch";
    placeholder.disabled = true;
    placeholder.selected = true;
    subBranchSelect.appendChild(placeholder);

    subs.forEach(function(sb){
      const opt = document.createElement("option");
      opt.value = sb;
      opt.textContent = sb;
      subBranchSelect.appendChild(opt);
    });
    subBranchSelect.disabled = false;
    subBranchSelect.setAttribute("required", "required");
  }
});

/* ====== BUILD AREA DROPDOWN ====== */
const areaSelect = document.getElementById("area");
Object.keys(areaData).forEach(function(area){
  const opt = document.createElement("option");
  opt.value = area;
  opt.textContent = area;
  areaSelect.appendChild(opt);
});

const roomSelect = document.getElementById("roomNo");
areaSelect.addEventListener("change", function(){
  const rooms = areaData[this.value] || [];
  roomSelect.innerHTML = "";

  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "Select room";
  placeholder.disabled = true;
  placeholder.selected = true;
  roomSelect.appendChild(placeholder);

  rooms.forEach(function(room){
    const opt = document.createElement("option");
    opt.value = room;
    opt.textContent = room;
    roomSelect.appendChild(opt);
  });
  roomSelect.disabled = rooms.length === 0;
});

/* ====== SUBMIT HANDLER ====== */
const form = document.getElementById("employeeForm");
const submitBtn = document.getElementById("submitBtn");
const statusMsg = document.getElementById("statusMsg");
const banner = document.getElementById("banner");

form.addEventListener("submit", function(e){
  e.preventDefault();

  if (SCRIPT_URL.indexOf("PASTE_YOUR") === 0){
    showBanner("err", "Form is not connected yet — set SCRIPT_URL in the code first.");
    return;
  }

  submitBtn.disabled = true;
  statusMsg.textContent = "Submitting…";
  statusMsg.className = "status";
  banner.className = "banner";

  const formData = new FormData(form);

  fetch(SCRIPT_URL, {
    method: "POST",
    body: formData
  })
  .then(function(res){ return res.json(); })
  .then(function(data){
    if (data.result === "success"){
      showBanner("ok", "Thank you. Your details have been recorded successfully.");
      form.reset();
      subBranchSelect.innerHTML = '<option value="" selected>Not applicable</option>';
      subBranchSelect.disabled = true;
      roomSelect.innerHTML = '<option value="" disabled selected>Select area first</option>';
      roomSelect.disabled = true;
      statusMsg.textContent = "";
    } else {
      throw new Error(data.error || "Unknown error");
    }
  })
  .catch(function(err){
    showBanner("err", "Something went wrong. Please try again.");
    statusMsg.textContent = "";
    console.error(err);
  })
  .finally(function(){
    submitBtn.disabled = false;
  });
});

function showBanner(type, text){
  banner.textContent = text;
  banner.className = "banner show " + type;
}
</script>

</body>
</html>
