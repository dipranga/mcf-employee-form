<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Data Form</title>
<style>
  :root{
    --ink:#1c2b3a;
    --ink-soft:#4a5b6c;
    --line:#d7dde3;
    --field-bg:#f6f8fa;
    --accent:#0b5fa5;
    --accent-dark:#08477d;
    --ok-bg:#e8f4ea;
    --ok-ink:#1f6b3a;
    --err:#b3261e;
    --paper:#ffffff;
    --canvas:#eef2f5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI", Tahoma, Arial, sans-serif;
    background:var(--canvas);
    color:var(--ink);
    padding:32px 16px 64px;
  }
  .sheet{
    max-width:720px;
    margin:0 auto;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
  }
  .letterhead{
    background:var(--accent-dark);
    color:#fff;
    padding:22px 28px;
    border-bottom:4px solid var(--accent);
  }
  .letterhead .dept{
    font-size:13px;
    letter-spacing:.02em;
    opacity:.85;
    margin:0 0 4px;
  }
  .letterhead h1{
    font-size:21px;
    margin:0 0 6px;
    font-weight:600;
  }
  .letterhead p{
    margin:0;
    font-size:13px;
    opacity:.9;
    line-height:1.5;
  }
  form{
    padding:28px;
  }
  .field{
    margin-bottom:18px;
  }
  .field label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }
  .field .hint{
    font-weight:400;
    color:var(--ink-soft);
    font-size:12px;
  }
  .field input,
  .field select,
  .field textarea{
    width:100%;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
    color:var(--ink);
    background:var(--field-bg);
    border:1px solid var(--line);
    border-radius:4px;
    outline:none;
    transition:border-color .15s, background .15s;
  }
  .field input:focus,
  .field select:focus,
  .field textarea:focus{
    border-color:var(--accent);
    background:#fff;
  }
  .field select:disabled,
  .field input:disabled{
    background:#eceff2;
    color:#98a3ad;
    cursor:not-allowed;
  }
  .field textarea{
    resize:vertical;
    min-height:64px;
  }
  .row2{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  @media (max-width:520px){
    .row2{grid-template-columns:1fr;}
  }
  .required-mark{
    color:var(--err);
    margin-left:2px;
  }
  .submit-row{
    margin-top:26px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  button[type="submit"]{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:12px 26px;
    font-size:14.5px;
    font-weight:600;
    border-radius:4px;
    cursor:pointer;
    transition:background .15s;
  }
  button[type="submit"]:hover{
    background:var(--accent-dark);
  }
  button[type="submit"]:disabled{
    background:#9fb6c7;
    cursor:not-allowed;
  }
  .status{
    font-size:13.5px;
  }
  .status.ok{color:var(--ok-ink);}
  .status.err{color:var(--err);}
  .banner{
    display:none;
    margin:0 28px 0;
    padding:14px 16px;
    border-radius:4px;
    font-size:14px;
  }
  .banner.show{display:block;}
  .banner.ok{
    background:var(--ok-bg);
    color:var(--ok-ink);
    border:1px solid #bfe0c6;
  }
  .banner.err{
    background:#fbeceb;
    color:var(--err);
    border:1px solid #f0c4c1;
  }
  .foot-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:18px;
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="letterhead">
    <p class="dept">Municipal Corporation</p>
    <h1>Employee Data Collection Form</h1>
    <p>Please fill in the details accurately. Fields marked <span class="required-mark">*</span> are mandatory.</p>
  </div>

  <div id="banner" class="banner"></div>

  <form id="employeeForm">

    <div class="field">
      <label for="fullName">Full Name <span class="required-mark">*</span></label>
      <input type="text" id="fullName" name="Full Name" required autocomplete="off">
    </div>

    <div class="row2">
      <div class="field">
        <label for="branch">Branch <span class="required-mark">*</span></label>
        <select id="branch" name="Branch" required>
          <option value="" disabled selected>Select branch</option>
        </select>
      </div>

      <div class="field">
        <label for="subBranch">Sub-Branch <span class="required-mark">*</span></label>
        <select id="subBranch" name="Sub-Branch" required>
          <option value="" selected>Not applicable</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="office">Office <span class="hint">(if applicable)</span></label>
      <select id="office" name="Office" disabled>
        <option value="" selected>Not applicable</option>
      </select>
    </div>

    <div class="field">
      <label for="designation">Designation <span class="required-mark">*</span></label>
      <select id="designation" name="Designation" required>
        <option value="" disabled selected>Select designation</option>
      </select>
    </div>

    <div class="field" id="designationOtherWrap" style="display:none;">
      <label for="designationOther">Please specify designation <span class="required-mark">*</span></label>
      <input type="text" id="designationOther" name="Designation (Other)" autocomplete="off">
    </div>

    <div class="row2">
      <div class="field">
        <label for="wardNo">Ward No. <span class="hint">(if applicable)</span></label>
        <select id="wardNo" name="Ward No">
          <option value="" selected>Not applicable</option>
        </select>
      </div>
      <div class="field">
        <label for="zoneNo">Zone No. <span class="hint">(if applicable)</span></label>
        <select id="zoneNo" name="Zone No">
          <option value="" selected>Not applicable</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div class="field" id="wardOtherWrap" style="display:none;">
        <label for="wardOther">Please specify ward no.</label>
        <input type="text" id="wardOther" name="Ward No (Other)" autocomplete="off">
      </div>
      <div class="field" id="zoneOtherWrap" style="display:none;">
        <label for="zoneOther">Please specify zone no.</label>
        <input type="text" id="zoneOther" name="Zone No (Other)" autocomplete="off">
      </div>
    </div>

    <div class="field">
      <label for="empNo">Employee No. / HKRN Code <span class="required-mark">*</span></label>
      <input type="text" id="empNo" name="Employee No / HKRN Code" required autocomplete="off">
    </div>

    <div class="row2">
      <div class="field">
        <label for="area">Area <span class="required-mark">*</span></label>
        <select id="area" name="Area" required>
          <option value="" disabled selected>Select area</option>
        </select>
      </div>

      <div class="field">
        <label for="roomNo">Room No. <span class="required-mark">*</span></label>
        <select id="roomNo" name="Room No" required disabled>
          <option value="" disabled selected>Select area first</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="phNo">Ph. No. <span class="required-mark">*</span></label>
        <input type="tel" id="phNo" name="Ph No" required autocomplete="off" pattern="[0-9+ -]{7,15}">
      </div>
      <div class="field">
        <label for="email">Email <span class="required-mark">*</span></label>
        <input type="email" id="email" name="Email" required autocomplete="off">
      </div>
    </div>

    <div class="field">
      <label for="remarks">Remarks <span class="hint">(if any)</span></label>
      <textarea id="remarks" name="Remarks"></textarea>
    </div>

    <div class="submit-row">
      <button type="submit" id="submitBtn">Submit</button>
      <span id="statusMsg" class="status"></span>
    </div>
  </form>

  <p class="foot-note">Your response is recorded directly against your name and branch. Please review before submitting.</p>
</div>

<script>
/* ====== CONFIGURATION ====== */

// Paste your deployed Google Apps Script Web App URL here
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-52cDGEAZqxBEKl2Lea4jjUh7nR1KTFnSJPAswUu_QPSKwxBVz6oWVQrsoTbeV8c1/exec";

/* ====== DATA: BRANCH -> SUB-BRANCH ====== */
// A branch with an empty array has no sub-branches (dropdown stays disabled / "Not applicable").
const branchData = {
  "Mayor": [],
  "Commissioner (CMC)": ["Commissioner Office"],
  "Additional Commissioner": ["ACMC-I Office", "ACMC-II Office"],
  "Additional Municipal Commissioner": ["AMC Office"],
  "Joint Commissioner": ["Joint Commissioner HQ (JCHQ)", "Joint Commissioner Town (JCT)", "Joint Commissioner Faridabad (JCF)", "Joint Commissioner Ballabgarh (JCB)", "Joint Commissioner Gr. Faridabad (JCGF)"],
  "Engineering Branch": ["CE-I Office", "CE-II Office", "SE-I Office", "SE-II Office", "Swachh Bharat Mission (SBM) Office", "Div-HQ", "Div-I", "Div-II", "Div-III", "Div-IV", "Div-V", "CCIP", "Advertisement Branch", "Enforcement Branch", "Survey", "Vehicle Branch", "Electrical Branch", "Horticulture"],
  "Corporation Secretary (CS)": ["Corporation Secretary (CS) Office"],
  "Establishment Branch (EO)": ["Establishment Office"],
  "Planning Branch": ["Planning Office", "Architect Branch", "Estate Branch"],
  "District Attorny (DA)": ["DA Office"],
  "Medical Office of Health (MOH) Branch": ["MOH Office", "Birth & Death"],
  "Audit Branch": ["Ausit Office"],
  "Accounts Branch": ["Accounts Office", "Bill Branch"],
  "Taxation": ["Zonal Taxation Office", "Water Division"],
  "HRMS Cell": ["Human Resource Management System (HRMS) Office"],
  "IT Cell": ["IT Cell"],
  "CPO Branch": ["CPO Office"],
  "Citizen Facilitation Centre (CFC)": ["CFC Office"],
  "AMRUT": ["AMRUT"],
  "Tehsildar Branch": ["Tehsildar Office"],
  "AMRUT 2.0": ["AMRUT 2.0"],
  "CM Window": ["CM Window"],
  "RTI Cell": ["RTI Cell"],
  "Library": ["Library Office"],
};

/* ====== DATA: SUB-BRANCH -> OFFICE ======
 * Key format: "Branch||Sub-Branch" (exact strings from branchData above).
 * A key with no entry here means Office stays "Not applicable" for that sub-branch.
 * FILL THIS IN with your real office lists — this is a placeholder structure only.
 */
const officeData = {
  // Example — replace with real data:
  "Engineering Branch||Enforcement Branch": ["Enforcement Branch (NIT & Badkhal)", "Enforcement Branch (Old)", "Enforcement Branch (BLB)", "Enforcement Branch (Chandawali)"],
  "Engineering Branch||Survey": ["Survey (NIT)", "Survey (OLD)", "Survey (BLB)"],
  "Engineering Branch||Horticulture": ["Horticulture (NIT & Badkhal)", "Horticulture (Old)", "Horticulture (BLB)", "Horticultur (Tigaon Chandawali)"],
  "Planning Branch||Architect Branch": ["Sr. Architect Office"],
  "Medical Office of Health (MOH) Branch||Birth & Death": ["Birth & Death (NIT)", "Birth & Death (OLD Zone-I)", "Birth & Death (OLD Zone-II)", "Birth & Death (BLB)", "Birth & Death (Sec-37)"],
  "Taxation||Zonal Taxation Office": ["ZTO (HQ)", "ZTO Zone-I (NIT)", "ZTO Zone-II (NIT)", "ZTO Zone-I (OLD)", "ZTO Zone-II (OLD)", "ZTO Zone-I (BLB)", "ZTO Zone-II (BLB)", "ZTO Zone-I (Chandawali)"],
  "Taxation||Water Division": ["Water Zone-I & II (NIT)", "Water Zone-III (NIT)", "Water Zone OLD", "Water Zone BLB"]
};

/* ====== DATA: DESIGNATIONS ====== */
// Edit this list freely to match your office's actual designation set.
const designationData = [
  "Commissioner",
  "Additional Commissioner",
  "Joint Commissioner",
  "Corporation Secretary",
  "District Attorny",
  "Assistant District Attorney",
  "Administrative Officer",
  "Medical Officer of Health (MOH)",
  "Executive Engineer",
  "Sub Divisional Engineer (SDE)",
  "Assistant Engineer (JE)",
  "Junior Engineer (JE)",
  "Superintendent",
  "Section Officer",
  "Accountant",
  "Financial Controller",
  "Auditor",
  "Account Officer",
  "Asstt. Accounts Officer",
  "Road Inspector",
  "Mason",
  "Treasurer",
  "Meter Reader",
  "Naib Tehsildar",
  "Kanungo",
  "Patwari",
  "Tubewell Mechanic",
  "Motor Mechanic",
  "Vehicle Inspector",
  "Road Roller Driver",
  "Horticulture Inspector",
  "Senior Librarian",
  "Junior Librarian",
  "Carpenter",
  "Surveyor",
  "Plumber Fitter Grade I",
  "Plumber Fitter Grade II",
  "Senior Sanitary Inspector",
  "Sanitary Inspector",
  "Sewer Inspector",
  "Assistant Sanitary Inspector",
  "Khalasi",
  "Library Attendant",
  "Financial Expert",
  "Head Mali",
  "Mechanical Helper",
  "Senior Assistant",
  "Junior Assistant",
  "Clerk",
  "Steno",
  "Junior Scale Stenographer",
  "Senior Scale Stenographer",
  "Establishment Officer",
  "Social Welfare Officer",
  "Petrolman",
  "Registrar",
  "Sub-Registrar",
  "Assistant",
  "Inspector",
  "Chief Engineer",
  "Superintendent Engineer",
  "Pump Operator",
  "Assistant Pump Operator",
  "Personal Assistant (PA)",
  "Tax Inspector",
  "Tax Sub-Inspector",
  "Sanitary Inspector",
  "Sanitary Supervisor",
  "Draftsman",
  "Circle Heads Draftsman",
  "Mali",
  "Mali-cum-chowkidar (MCC)",
  "Lady Ward Attendant",
  "Keyman",
  "Valveman",
  "Oil Man",
  "Helper to Water Pump Operator",
  "Asst. Water Pump Operator ",
  "Head Mali",
  "Junior Programmer",
  "Programmer",
  "Security Man",
  "Sewerman",
  "Cleaner",
  "Beldar",
  "Private Secretary (PS)",
  "City Project Officer",
  "Tehsildar",
  "Planning Assistant",
  "Computer Operator",
  "Data Entry Operator (DEO)",
  "Driver",
  "Zonal &  Taxation Officer (ZTO)",
  "Electrician Helper",
  "Bill Distributor",
  "Chowkidar",
  "MTS",
  "Peon",
  "Chowkidar",
  "Safai Karamchari",
  "Town Planner",
  "Chief Town Planner",
  "Senior Town Planner",
  "District Town Planner",
  "Planning Expert",
  "Tracer",
  "Architect",
  "Sr. Architect",
  "Jr. Architect",
  "Architecture Expert",
  "Assistant Safai Daroga",
  "Fitter Helper",
  "Tubewell Helper",
  "Other"
];

/* ====== DATA: WARD NO. / ZONE NO. ====== */
// Edit these ranges to match your corporation's actual ward/zone count.
const wardCount = 47;
const zoneCount = 6;

/* ====== DATA: AREA -> ROOM NO. ====== */
function roomsForArea(){
  return ["001", "002", "003", "004", "005"];
}
const areaData = {
  "NIT": roomsForArea(),
  "OLD": roomsForArea(),
  "BLB": roomsForArea()
};

/* ====== BUILD BRANCH DROPDOWN ====== */
const branchSelect = document.getElementById("branch");
Object.keys(branchData).forEach(function(branch){
  const opt = document.createElement("option");
  opt.value = branch;
  opt.textContent = branch;
  branchSelect.appendChild(opt);
});

const subBranchSelect = document.getElementById("subBranch");
const officeSelect = document.getElementById("office");

function resetOfficeDropdown(){
  officeSelect.innerHTML = '<option value="" selected>Not applicable</option>';
  officeSelect.disabled = true;
  officeSelect.removeAttribute("required");
}

function refreshOfficeDropdown(){
  const branch = branchSelect.value;
  const sub = subBranchSelect.value;
  const key = branch + "||" + sub;
  const offices = officeData[key] || [];

  if (!sub || offices.length === 0){
    resetOfficeDropdown();
    return;
  }

  officeSelect.innerHTML = "";
  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "Select office";
  placeholder.disabled = true;
  placeholder.selected = true;
  officeSelect.appendChild(placeholder);

  offices.forEach(function(o){
    const opt = document.createElement("option");
    opt.value = o;
    opt.textContent = o;
    officeSelect.appendChild(opt);
  });
  officeSelect.disabled = false;
}

branchSelect.addEventListener("change", function(){
  const subs = branchData[this.value] || [];
  subBranchSelect.innerHTML = "";

  if (subs.length === 0){
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "Not applicable";
    opt.selected = true;
    subBranchSelect.appendChild(opt);
    subBranchSelect.disabled = true;
    subBranchSelect.removeAttribute("required");
  } else {
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = "Select sub-branch";
    placeholder.disabled = true;
    placeholder.selected = true;
    subBranchSelect.appendChild(placeholder);

    subs.forEach(function(sb){
      const opt = document.createElement("option");
      opt.value = sb;
      opt.textContent = sb;
      subBranchSelect.appendChild(opt);
    });
    subBranchSelect.disabled = false;
    subBranchSelect.setAttribute("required", "required");
  }

  resetOfficeDropdown();
});

subBranchSelect.addEventListener("change", function(){
  refreshOfficeDropdown();
});

/* ====== BUILD DESIGNATION DROPDOWN ====== */
const designationSelect = document.getElementById("designation");
designationData.forEach(function(d){
  const opt = document.createElement("option");
  opt.value = d;
  opt.textContent = d;
  designationSelect.appendChild(opt);
});

const designationOtherWrap = document.getElementById("designationOtherWrap");
const designationOtherInput = document.getElementById("designationOther");
designationSelect.addEventListener("change", function(){
  if (this.value === "Other"){
    designationOtherWrap.style.display = "block";
    designationOtherInput.setAttribute("required", "required");
  } else {
    designationOtherWrap.style.display = "none";
    designationOtherInput.removeAttribute("required");
    designationOtherInput.value = "";
  }
});

/* ====== BUILD WARD NO. / ZONE NO. DROPDOWNS ====== */
function buildNumberedSelect(selectEl, count, otherWrapEl, otherInputEl){
  for (let i = 1; i <= count; i++){
    const opt = document.createElement("option");
    opt.value = String(i);
    opt.textContent = String(i);
    selectEl.appendChild(opt);
  }
  const otherOpt = document.createElement("option");
  otherOpt.value = "Other";
  otherOpt.textContent = "Other";
  selectEl.appendChild(otherOpt);

  selectEl.addEventListener("change", function(){
    if (this.value === "Other"){
      otherWrapEl.style.display = "block";
    } else {
      otherWrapEl.style.display = "none";
      otherInputEl.value = "";
    }
  });
}

const wardSelect = document.getElementById("wardNo");
const wardOtherWrap = document.getElementById("wardOtherWrap");
const wardOtherInput = document.getElementById("wardOther");
buildNumberedSelect(wardSelect, wardCount, wardOtherWrap, wardOtherInput);

const zoneSelect = document.getElementById("zoneNo");
const zoneOtherWrap = document.getElementById("zoneOtherWrap");
const zoneOtherInput = document.getElementById("zoneOther");
buildNumberedSelect(zoneSelect, zoneCount, zoneOtherWrap, zoneOtherInput);

/* ====== BUILD AREA DROPDOWN ====== */
const areaSelect = document.getElementById("area");
Object.keys(areaData).forEach(function(area){
  const opt = document.createElement("option");
  opt.value = area;
  opt.textContent = area;
  areaSelect.appendChild(opt);
});

const roomSelect = document.getElementById("roomNo");
areaSelect.addEventListener("change", function(){
  const rooms = areaData[this.value] || [];
  roomSelect.innerHTML = "";

  const placeholder = document.createElement("option");
  placeholder.value = "";
  placeholder.textContent = "Select room";
  placeholder.disabled = true;
  placeholder.selected = true;
  roomSelect.appendChild(placeholder);

  rooms.forEach(function(room){
    const opt = document.createElement("option");
    opt.value = room;
    opt.textContent = room;
    roomSelect.appendChild(opt);
  });
  roomSelect.disabled = rooms.length === 0;
});

/* ====== SUBMIT HANDLER ====== */
const form = document.getElementById("employeeForm");
const submitBtn = document.getElementById("submitBtn");
const statusMsg = document.getElementById("statusMsg");
const banner = document.getElementById("banner");

form.addEventListener("submit", function(e){
  e.preventDefault();

  if (SCRIPT_URL.indexOf("PASTE_YOUR") === 0){
    showBanner("err", "Form is not connected yet — set SCRIPT_URL in the code first.");
    return;
  }

  submitBtn.disabled = true;
  statusMsg.textContent = "Submitting…";
  statusMsg.className = "status";
  banner.className = "banner";

  const formData = new FormData(form);
  const MAX_ATTEMPTS = 4;

  function attemptSubmit(attempt){
    return fetch(SCRIPT_URL, { method: "POST", body: formData })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data.result === "success"){
          return data;
        }
        throw new Error(data.error || "Unknown error");
      })
      .catch(function(err){
        if (attempt < MAX_ATTEMPTS){
          const waitMs = 1000 * Math.pow(2, attempt - 1); // 1s, 2s, 4s, 8s
          statusMsg.textContent = "Server busy, retrying… (attempt " + (attempt + 1) + " of " + MAX_ATTEMPTS + ")";
          return new Promise(function(resolve){
            setTimeout(function(){ resolve(attemptSubmit(attempt + 1)); }, waitMs);
          });
        }
        throw err;
      });
  }

  attemptSubmit(1)
  .then(function(){
    showBanner("ok", "Thank you. Your details have been recorded successfully.");
    form.reset();
    subBranchSelect.innerHTML = '<option value="" selected>Not applicable</option>';
    subBranchSelect.disabled = true;
    resetOfficeDropdown();
    roomSelect.innerHTML = '<option value="" disabled selected>Select area first</option>';
    roomSelect.disabled = true;
    designationOtherWrap.style.display = "none";
    designationOtherInput.removeAttribute("required");
    wardOtherWrap.style.display = "none";
    zoneOtherWrap.style.display = "none";
    statusMsg.textContent = "";
  })
  .catch(function(err){
    showBanner("err", "Server is busy right now. Please wait a moment and try submitting again.");
    statusMsg.textContent = "";
    console.error(err);
  })
  .finally(function(){
    submitBtn.disabled = false;
  });
});

function showBanner(type, text){
  banner.textContent = text;
  banner.className = "banner show " + type;
}
</script>

</body>
</html>
